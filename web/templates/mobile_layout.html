<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 优化全屏显示 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}智能导航伴侣{% endblock %}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <style>
        :root {
            /* 现代深色模式色系 (iOS/Android 融合风) */
            --bg-base: #121212;
            --bg-surface: #1E1E1E;
            --bg-elevated: #2C2C2C;

            /* 点缀与交互色 */
            --primary: #34C759;
            /* 苹果绿，用于核心突出的按钮如"开始导航" */
            --primary-dark: #248A3D;
            --accent: #0A84FF;
            /* 强调蓝，用于选中状态、链接等 */
            --danger: #FF453A;
            /* 危险红 */
            --warning: #FF9F0A;
            /* 警告橙 */

            /* 文字颜色 */
            --text-primary: #F5F5F7;
            --text-secondary: #98989D;
            --text-muted: #636366;

            /* 其他 */
            --border-color: rgba(255, 255, 255, 0.1);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;

            /* 底部导航栏高度 */
            --tabbar-height: 84px;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* 基础重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            /* 移除点击高亮 */
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* 防止原生滚动反弹，使用内部滚动 */
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 (Header) */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 内容区域 */
        .app-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            padding-bottom: calc(var(--tabbar-height) + 16px);
            /* 留出底部空间 */
        }

        /* 毛玻璃卡片基类 */
        .glass-card {
            background-color: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        /* 底部导航栏 (Bottom Navbar) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(var(--tabbar-height) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            height: 100%;
            transition: color 0.2s ease;
        }

        .nav-item .material-icons-round {
            font-size: 28px;
            margin-bottom: 4px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        /* 选中状态 */
        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active .material-icons-round {
            transform: translateY(-2px);
        }

        /* 统一输入框风格 */
        .modern-input {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .modern-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15);
        }

        /* 统一按钮风格 */
        .btn-modern {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .btn-modern:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #000;
            /* 高对比度 */
        }

        .btn-danger {
            background-color: var(--danger);
            color: #fff;
        }

        .btn-secondary {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        /* 工具类 */
        .text-accent {
            color: var(--accent);
        }

        .text-success {
            color: var(--primary);
        }

        .text-danger {
            color: var(--danger);
        }

        .text-warning {
            color: var(--warning);
        }

        .text-muted {
            color: var(--text-muted);
        }

            {
            % block extra_css %
        }

            {
            % endblock %
        }
    </style>
</head>

<body>
    <!-- 顶部标题栏 -->
    <header class="app-header">
        <div class="app-title">
            <span class="material-icons-round" style="color: var(--primary);">accessibility_new</span>
            {% block header_title %}智能导盲伴侣{% endblock %}
        </div>
        {% block header_actions %}{% endblock %}
    </header>

    <!-- 主内容区 -->
    <main class="app-content">
        {% block content %}{% endblock %}
    </main>

    <!-- 底部常驻导航 Tab -->
    <nav class="bottom-nav">
        {% if user.role == 'guardian' %}
        <a href="{{ url_for('index') }}" class="nav-item" style="color: var(--accent);">
            <span class="material-icons-round">dashboard</span>
            <span>控制台</span>
        </a>
        {% endif %}
        <a href="{{ url_for('mobile_nav') }}" class="nav-item {% if active_tab == 'nav' %}active{% endif %}">
            <span class="material-icons-round">explore</span>
            <span>导航</span>
        </a>
        <a href="{{ url_for('mobile_history') }}" class="nav-item {% if active_tab == 'history' %}active{% endif %}">
            <span class="material-icons-round">history</span>
            <span>记录</span>
        </a>
        <a href="{{ url_for('mobile_settings') }}" class="nav-item {% if active_tab == 'settings' %}active{% endif %}">
            <span class="material-icons-round">settings</span>
            <span>设置</span>
        </a>
    </nav>

    <!-- 共有脚本：Socket.IO 全局连接与语音播放功能可以放在这里 -->
    <script>
        const socket = io();

        // 全局连接状态监听
        socket.on('connect', () => {
            const badge = document.getElementById('conn-badge');
            if (badge) {
                badge.innerHTML = '<span class="status-dot" style="width:8px;height:8px;background:var(--primary);border-radius:50%;display:inline-block;"></span> 已连接';
                badge.className = 'badge badge-success';
            }
            if (typeof window.addLog === 'function') {
                const out = document.getElementById('output');
                if (out && out.innerHTML.includes('准备就绪')) {
                    window.addLog("系统已连接", "info");
                } else if (!out) {
                    console.log("Socket connected");
                }
            }
        });

        socket.on('disconnect', () => {
            const badge = document.getElementById('conn-badge');
            if (badge) {
                badge.innerHTML = '<span class="status-dot" style="width:8px;height:8px;background:var(--danger);border-radius:50%;display:inline-block;"></span> 已断开';
                badge.className = 'badge badge-error';
            }
            if (typeof window.addLog === 'function') {
                window.addLog("系统断开连接，正在重试...", "danger");
            }
        });

        // 全局：来自监护端的实时语音报警播放
        socket.on('play_audio_stream', (data) => {
            if (data && data.audio_data) {
                const audioUrl = "data:audio/webm;base64," + data.audio_data;
                const audio = new Audio(audioUrl);

                // 收到语音尝试播放
                audio.play().catch(e => {
                    console.error("Auto-play failed:", e);
                    // 现代浏览器需要用户曾有交互才允许自动播放音频
                });

                // 如果存在特定函数(addLog)，则调用它提醒
                if (typeof window.addLog === 'function') {
                    window.addLog("收到来自监护人的紧急语音 🔊", 'warning');
                }
            }
        });

        // 全局：文字语音播报 (TTS)
        socket.on('voice_msg', (data) => {
            if (typeof window.addLog === 'function') {
                window.addLog(data.text);
            }
            // 本地调用 Web Speech API 进行播报
            const synth = window.speechSynthesis;
            if (synth) {
                // 如果是最高优先级警告 (priority: 0)，立刻打断正在播放的语音
                if (data.priority === 0 || data.text.includes("警告") || data.text.includes("红灯") || data.text.includes("停止")) {
                    synth.cancel();
                }
                const utterThis = new SpeechSynthesisUtterance(data.text);
                utterThis.lang = 'zh-CN';
                synth.speak(utterThis);
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>

</html>
