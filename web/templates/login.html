{% extends "auth_layout.html" %}

{% block content %}
<div class="brand-header">
    <div class="brand-logo">👁️</div>
    <h1 class="brand-title">欢迎回来</h1>
    <p class="brand-subtitle">请登录您的监护端账户</p>
</div>

<form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
        <label for="username" class="form-label">用户名</label>
        <input type="text" id="username" name="username" class="form-input" required placeholder="请输入用户名" autofocus>
    </div>

    <div class="form-group">
        <label for="password" class="form-label">密码</label>
        <input type="password" id="password" name="password" class="form-input" required placeholder="请输入密码">
    </div>

    <!-- Captcha -->
    <div class="form-group">
        <label for="captcha" class="form-label">安全验证</label>
        <div class="captcha-row">
            <input type="text" id="captcha" name="captcha" class="form-input" required placeholder="输入右侧代码"
                autocomplete="off">
            <div class="captcha-display" title="验证码">{{ captcha_code }}</div>
        </div>
    </div>

    <button type="submit" class="btn-primary">立即登录</button>
</form>

<div class="auth-footer">
    还没有账户？ <a href="{{ url_for('auth.register') }}" class="auth-link">立即注册</a>
</div>
{% endblock %}
